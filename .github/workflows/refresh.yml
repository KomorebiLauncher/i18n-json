name: Refresh

# The .ts catalogue in KomorebiLauncher/i18n decides which strings exist; this rebuilds the
# per-language JSON files from it, so new and reworded source strings get a fresh key. Translations
# already in `json/` are kept (`--keep json`) — they are the editable copy now that no external
# platform owns them — and the merge workflow in the i18n repository writes them back into the .ts
# files it compiles into language packs.
on:
  schedule:
    # The catalogue is refreshed at 04:00 on Mondays; pick the new strings up half an hour later.
    - cron: '30 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would change
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check out the catalogue
        run: git clone --depth 1 https://github.com/KomorebiLauncher/i18n.git catalogue

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Refresh the source strings
        run: python tools/export.py --catalogue catalogue --out json --keep json

      - name: Commit changes
        if: ${{ inputs.dry_run != true }}
        run: |
          rm -rf catalogue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Refresh the source strings"
            git push
          fi
