name: Export the catalogue

# The catalogue lives in KomorebiLauncher/i18n: update-strings.yml refreshes the source strings at
# 04:00 on Mondays and pull-paratranz.yml brings the translations back at 05:00. This runs half an
# hour after that, so the export the translation platform reads is never stale.
on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check out the catalogue
        run: git clone --depth 1 https://github.com/KomorebiLauncher/i18n.git catalogue

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Export
        run: python tools/export.py --catalogue catalogue --out json

      - name: Commit changes
        run: |
          rm -rf catalogue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "the export is already current"
          else
            git commit -m "Update the export"
            git push
          fi
