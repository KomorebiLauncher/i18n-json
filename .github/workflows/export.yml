name: Export the catalogue

# The catalogue itself lives in KomorebiLauncher/i18n, where update-strings.yml refreshes the
# source strings on Monday mornings. This runs half an hour later so the translation platform
# never reads a stale export.
on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check out the catalogue
        run: git clone --depth 1 https://github.com/KomorebiLauncher/i18n.git catalogue

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Export
        run: python tools/export.py --catalogue catalogue --out json

      - name: Commit changes
        run: |
          rm -rf catalogue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "the export is already current"
          else
            git commit -m "Update the export"
            git push
          fi
